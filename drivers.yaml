/trips/{tripId}/invitations/accept:
  post:
    tags:
    - Drivers
    summary: Tài xế chấp nhận lời mời chuyến (FR18, UC10, AC16)
    parameters:
    - $ref: ../components/parameters.yaml#/TripIdParam
    responses:
      '200':
        description: Chuyến được gán cho tài xế, khách hàng được thông báo
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Trip
      '409':
        description: Lời mời đã hết hạn hoặc đã được tài xế khác nhận
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
/trips/{tripId}/invitations/reject:
  post:
    tags:
    - Drivers
    summary: Tài xế từ chối lời mời chuyến (FR18, AC17) — hệ thống tự tìm tài xế khác (RN10)
    parameters:
    - $ref: ../components/parameters.yaml#/TripIdParam
    responses:
      '200':
        description: Từ chối ghi nhận, hệ thống chuyển sang tài xế kế tiếp
/drivers/register:
  post:
    tags:
    - Drivers
    summary: Đăng ký / khởi tạo tài khoản tài xế (FR14, UC08)
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/DriverRegisterRequest
    responses:
      '201':
        description: Tài khoản ở trạng thái chờ duyệt (AC13)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Driver
/drivers/{driverId}/profile:
  put:
    tags:
    - Drivers
    summary: Cập nhật hồ sơ & thông tin phương tiện (FR15, AC14)
    parameters:
    - $ref: ../components/parameters.yaml#/DriverIdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/DriverProfileUpdateRequest
    responses:
      '200':
        description: Cập nhật thành công
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Driver
/drivers/{driverId}/availability:
  patch:
    tags:
    - Drivers
    summary: Chuyển trạng thái sẵn sàng / không sẵn sàng (FR16, UC09)
    parameters:
    - $ref: ../components/parameters.yaml#/DriverIdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            properties:
              status:
                type: string
                enum:
                - available
                - unavailable
    responses:
      '200':
        description: Trạng thái tài xế được cập nhật
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Driver
/drivers/{driverId}/trip-invitations:
  get:
    tags:
    - Drivers
    summary: Xem lời mời chuyến đang chờ phản hồi (FR17, AC15)
    parameters:
    - $ref: ../components/parameters.yaml#/DriverIdParam
    responses:
      '200':
        description: Danh sách lời mời đang chờ
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas.yaml#/Trip
/drivers/{driverId}/location:
  post:
    tags:
    - Drivers
    summary: Ghi nhận vị trí tài xế real-time (FR20) — tần suất theo RN28 (đang chờ xác nhận)
    parameters:
    - $ref: ../components/parameters.yaml#/DriverIdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/LocationUpdateRequest
    responses:
      '204':
        description: Ghi nhận thành công, không trả nội dung
